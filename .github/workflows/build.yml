name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir ZIP (si el proyecto se subió como zip)
        run: |
          Z=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -1)
          if [ -n "$Z" ]; then
            unzip -o "$Z" -d proyecto
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          S=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$S" ]; then
            echo "No se encontró settings.gradle.kts"
            find . -maxdepth 3 -not -path "./.git/*" | head -50
            exit 1
          fi
          cd "$(dirname "$S")"
          gradle assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Crucigramas-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
